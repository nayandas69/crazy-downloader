name: Publish Docker Image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4.4.1
        
      - name: Login to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker version
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG%-docker}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nayandas69/crazy-downloader:${{ steps.version.outputs.version }}
            ghcr.io/nayandas69/crazy-downloader:latest
