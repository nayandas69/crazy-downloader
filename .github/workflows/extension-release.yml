name: Extension Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing extension tag to publish or repair (e.g. v1.0.0)"
        required: true
        type: string

# Serialize publishing for the same tag, including manual recovery runs.
concurrency:
  group: extension-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"

      - name: Verify tag matches the extension version
        run: |
          VERSION=$(node -p "require('./extension/package.json').version")
          if [ "v$VERSION" != "${RELEASE_TAG}" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match extension version v${VERSION}. Bump extension/package.json and the manifests, or publish tag v${VERSION}."
            exit 1
          fi

      - name: Run tests
        working-directory: extension
        run: npm test

      - name: Build bundles
        working-directory: extension
        run: npm run build

      - name: Write checksums
        working-directory: extension/dist
        run: sha256sum *.zip > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              extension/dist/*.zip \
              extension/dist/SHA256SUMS.txt \
              --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "YouTube Cookies Exporter ${RELEASE_TAG}" \
              --notes-file extension/RELEASE_NOTES.md
          else
            gh release create "${RELEASE_TAG}" \
              extension/dist/*.zip \
              extension/dist/SHA256SUMS.txt \
              --verify-tag \
              --title "YouTube Cookies Exporter ${RELEASE_TAG}" \
              --notes-file extension/RELEASE_NOTES.md
          fi
